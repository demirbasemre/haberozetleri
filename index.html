<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hava Kargo Bülteni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EF;
    --surface: #FFFFFF;
    --navy: #0D1117;
    --navy-soft: #161B22;
    --red: #E63946;
    --red-muted: rgba(230,57,70,0.08);
    --text: #111218;
    --text-2: #4B5563;
    --text-3: #9CA3AF;
    --border: #E9E8E4;
    --border-soft: #F0EFeb;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    --radius: 12px;
    --radius-sm: 6px;

    --cat-filo: #1D6FE8;
    --cat-tech: #7C3AED;
    --cat-ortak: #059669;
    --cat-ozel: #DB2777;
    --cat-alt: #EA580C;
    --cat-atama: #0891B2;
    --cat-diger: #6B7280;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ────────────────────────────────────── */
  header {
    background: var(--navy);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .site-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 18px;
    color: #FFFFFF;
    white-space: nowrap;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  .site-name span {
    color: var(--red);
  }

  .header-divider {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .search-wrap {
    flex: 1;
    max-width: 360px;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.3);
    pointer-events: none;
    width: 15px;
    height: 15px;
  }

  #search {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 12px 8px 34px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: background 0.2s, border-color 0.2s;
    touch-action: manipulation;
  }
  #search::placeholder { color: rgba(255,255,255,0.3); }
  #search:focus { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.22); }

  .header-stat {
    margin-left: auto;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .header-stat b { color: rgba(255,255,255,0.85); font-weight: 600; }

  /* ── DATE TABS ───────────────────────────────── */
  .date-bar {
    background: var(--navy-soft);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: none;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .date-bar::-webkit-scrollbar { display: none; }

  .date-tabs {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 0;
  }

  .date-tab {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s;
    letter-spacing: 0.01em;
    user-select: none;
    touch-action: manipulation;
  }
  .date-tab:hover { color: rgba(255,255,255,0.7); }
  .date-tab.active { color: #fff; border-bottom-color: var(--red); }

  /* ── FILTER BAR ──────────────────────────────── */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 60px;
    z-index: 90;
  }

  .filter-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    align-items: center;
  }
  .filter-inner::-webkit-scrollbar { display: none; }

  .filter-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-right: 4px;
  }

  .cat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    flex-shrink: 0;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-2);
    user-select: none;
    touch-action: manipulation;
    min-height: 30px;
  }

  .cat-pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-pill:hover { background: var(--bg); border-color: #d1d5db; color: var(--text); }

  .cat-pill.active {
    color: white;
    border-color: transparent;
    box-shadow: var(--shadow-sm);
  }
  .cat-pill[data-cat="all"] .dot { background: var(--red); }
  .cat-pill[data-cat="all"].active { background: var(--red); }

  /* ── MAIN ────────────────────────────────────── */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 24px 72px;
  }

  /* ── DATE SECTION ────────────────────────────── */
  .date-section { margin-bottom: 52px; }

  .date-section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1.5px solid var(--border);
  }

  .date-heading {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 20px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .date-count {
    font-size: 12px;
    color: var(--text-3);
    font-weight: 400;
    background: var(--border-soft);
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ── ARTICLE GRID ────────────────────────────── */
  .article-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* ── ARTICLE CARD ────────────────────────────── */
  .article-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.35s ease both;
    cursor: default;
  }

  .article-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: transparent;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .article-card { animation: none; transition: none; }
    .article-card:hover { transform: none; }
  }

  /* Left accent bar */
  .card-accent {
    width: 3px;
    flex-shrink: 0;
    border-radius: 0;
    position: absolute;
    left: 0; top: 0; bottom: 0;
  }

  .card-inner {
    display: flex;
    flex-direction: row;
    flex: 1;
    position: relative;
  }

  .card-left-bar {
    width: 3px;
    flex-shrink: 0;
    border-radius: 12px 0 0 12px;
  }

  .card-body {
    padding: 16px 18px 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .card-cat-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
    color: white;
    text-transform: uppercase;
  }

  .dup-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 2px 7px;
    background: #FEF3C7;
    color: #92400E;
    border-radius: 4px;
    font-weight: 600;
  }

  .card-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 15.5px;
    font-weight: 400;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .card-summary {
    font-size: 13px;
    line-height: 1.68;
    color: var(--text-2);
    flex: 1;
    margin-bottom: 14px;
  }

  .card-summary strong {
    color: var(--text);
    font-weight: 600;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
    gap: 8px;
  }

  .card-source {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
  }

  .source-favicon {
    width: 13px;
    height: 13px;
    border-radius: 2px;
    opacity: 0.75;
  }

  .card-link {
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: gap 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-link:hover { gap: 6px; }
  .card-link:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }

  /* Analysis panel */
  .thy-panel {
    margin-top: 8px;
    padding: 10px 12px;
    background: #FFF8F8;
    border-left: 3px solid var(--red);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    line-height: 1.65;
    color: #7f1d1d;
    display: none;
  }
  .thy-panel.show { display: block; }

  .thy-toggle {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--red);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    padding: 0;
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: opacity 0.15s;
  }
  .thy-toggle:hover { opacity: 0.75; }

  /* ── LOADING ─────────────────────────────────── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 55vh;
    flex-direction: column;
    gap: 14px;
    color: var(--text-3);
    font-size: 13px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2.5px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  /* ── EMPTY STATE ─────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-3);
    display: none;
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.25; }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text-2); font-weight: 500; }
  .empty-state p { font-size: 13px; }

  /* ── FOOTER ──────────────────────────────────── */
  footer {
    background: var(--navy);
    color: rgba(255,255,255,0.3);
    text-align: center;
    padding: 20px 24px;
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  /* ── RESPONSIVE ──────────────────────────────── */
  @media (max-width: 768px) {
    .header-stat { display: none; }
    .header-divider { display: none; }
    .site-name { font-size: 16px; }
    .article-grid { grid-template-columns: 1fr; gap: 12px; }
    .main { padding: 20px 16px 56px; }
    .filter-inner { padding: 8px 16px; }
    .date-tabs { padding: 0 16px; }
    .header-inner { padding: 0 16px; gap: 12px; }
  }

  @media (max-width: 480px) {
    .search-wrap { max-width: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-name">Hava Kargo<span> Bülteni</span></div>
    <div class="header-divider"></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search" placeholder="Haberlerde ara…" autocomplete="off">
    </div>
    <div class="header-stat" id="header-stats"></div>
  </div>
</header>

<div class="date-bar" id="date-bar">
  <div class="date-tabs" id="date-tabs"></div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <span class="filter-label">Kategori</span>
    <div class="cat-pill active" data-cat="all">
      <span class="dot"></span>Tümü
    </div>
    <div class="cat-pill" data-cat="Filo & Network" data-color="var(--cat-filo)" style="--c:var(--cat-filo)">
      <span class="dot" style="background:var(--cat-filo)"></span>Filo &amp; Network
    </div>
    <div class="cat-pill" data-cat="Teknoloji & Dijitalleşme" data-color="var(--cat-tech)" style="--c:var(--cat-tech)">
      <span class="dot" style="background:var(--cat-tech)"></span>Teknoloji
    </div>
    <div class="cat-pill" data-cat="Ortaklık & İş Birlikleri" data-color="var(--cat-ortak)" style="--c:var(--cat-ortak)">
      <span class="dot" style="background:var(--cat-ortak)"></span>Ortaklık
    </div>
    <div class="cat-pill" data-cat="Özel Kargo" data-color="var(--cat-ozel)" style="--c:var(--cat-ozel)">
      <span class="dot" style="background:var(--cat-ozel)"></span>Özel Kargo
    </div>
    <div class="cat-pill" data-cat="Altyapı" data-color="var(--cat-alt)" style="--c:var(--cat-alt)">
      <span class="dot" style="background:var(--cat-alt)"></span>Altyapı
    </div>
    <div class="cat-pill" data-cat="Atama & Görevlendirme" data-color="var(--cat-atama)" style="--c:var(--cat-atama)">
      <span class="dot" style="background:var(--cat-atama)"></span>Atama
    </div>
    <div class="cat-pill" data-cat="Diğer" data-color="var(--cat-diger)" style="--c:var(--cat-diger)">
      <span class="dot" style="background:var(--cat-diger)"></span>Diğer
    </div>
  </div>
</div>

<main class="main" id="main">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Haberler yükleniyor…</div>
  </div>
  <div class="empty-state" id="empty-state">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <h3>Sonuç bulunamadı</h3>
    <p>Farklı arama veya filtre deneyin.</p>
  </div>
  <div id="cards-container"></div>
</main>

<footer>
  Bülten yapay zeka tarafından otomatik oluşturulmuştur. İçeriğin doğruluğu garanti edilmez.
</footer>

<script>
const CAT_COLORS = {
  'Filo & Network':           'var(--cat-filo)',
  'Teknoloji & Dijitalleşme': 'var(--cat-tech)',
  'Ortaklık & İş Birlikleri': 'var(--cat-ortak)',
  'Özel Kargo':               'var(--cat-ozel)',
  'Altyapı':                  'var(--cat-alt)',
  'Atama & Görevlendirme':    'var(--cat-atama)',
  'Diğer':                    'var(--cat-diger)'
};

const CAT_HEX = {
  'Filo & Network':           '#1D6FE8',
  'Teknoloji & Dijitalleşme': '#7C3AED',
  'Ortaklık & İş Birlikleri': '#059669',
  'Özel Kargo':               '#DB2777',
  'Altyapı':                  '#EA580C',
  'Atama & Görevlendirme':    '#0891B2',
  'Diğer':                    '#6B7280'
};

const SOURCE_LABELS = {
  'aircargonews':   'AirCargoNews',
  'aircargoweek':   'AirCargoWeek',
  'stattimes':      'StatTimes',
  'aircargoupdate': 'AirCargoUpdate',
  'payloadasia':    'PayloadAsia'
};

let allArticles = [];
let activeCat   = 'all';
let activeDate  = 'all';
let searchQuery = '';

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
}

function getFavicon(source) {
  const domains = {
    'aircargonews':   'aircargonews.net',
    'aircargoweek':   'aircargoweek.com',
    'stattimes':      'stattimes.com',
    'aircargoupdate': 'aircargoupdate.com',
    'payloadasia':    'payloadasia.com'
  };
  const domain = domains[source] || source;
  return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function getFilteredArticles() {
  return allArticles.filter(a => {
    const catMatch  = activeCat === 'all' || a.category === activeCat;
    const dateMatch = activeDate === 'all' || a.date === activeDate;
    const q = searchQuery.toLowerCase();
    const searchMatch = !q ||
      stripHtml(a.title   || '').toLowerCase().includes(q) ||
      stripHtml(a.summary || '').toLowerCase().includes(q) ||
      (a.source || '').toLowerCase().includes(q);
    return catMatch && dateMatch && searchMatch;
  });
}

const elLoading = document.getElementById('loading');
const elEmpty   = document.getElementById('empty-state');
const elCards   = document.getElementById('cards-container');

function renderCards(articles) {
  elLoading.style.display = 'none';

  const byDate = {};
  articles.forEach(a => {
    const d = a.date || 'Tarihsiz';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(a);
  });

  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));

  if (articles.length === 0) {
    elCards.innerHTML = '';
    elEmpty.style.display = 'block';
    return;
  }

  elEmpty.style.display = 'none';
  elCards.innerHTML = '';

  dates.forEach(date => {
    const section = document.createElement('div');
    section.className = 'date-section';

    const hdr = document.createElement('div');
    hdr.className = 'date-section-header';
    hdr.innerHTML = `
      <div class="date-heading">${formatDate(date)}</div>
      <div class="date-count">${byDate[date].length} haber</div>
    `;
    section.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'article-grid';

    byDate[date].forEach((article, i) => {
      const hex   = CAT_HEX[article.category] || '#6B7280';
      const hasThy = article.thyImpact && article.thyImpact !== 'notr' && article.thyAnalysis;
      const sourceLabel = SOURCE_LABELS[article.source] || article.source || '';

      const card = document.createElement('div');
      card.className = 'article-card';
      card.style.animationDelay = `${i * 35}ms`;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-left-bar" style="background:${hex}"></div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-cat-badge" style="background:${hex}">${article.category || 'Diğer'}</span>
              ${article.isDuplicate ? `<span class="dup-badge">↺ Tekrar haber</span>` : ''}
            </div>
            <div class="card-title">${article.title || ''}</div>
            <div class="card-summary">${article.summary || '<em style="color:var(--text-3)">Özet henüz oluşturulmadı.</em>'}</div>
            ${hasThy ? `
              <button class="thy-toggle" onclick="toggleThy(this)" aria-expanded="false">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                Analiz
              </button>
              <div class="thy-panel" role="region">${article.thyAnalysis}</div>
            ` : ''}
            <div class="card-footer">
              <div class="card-source">
                <img class="source-favicon" src="${getFavicon(article.source)}" alt="" loading="lazy" onerror="this.style.display='none'">
                ${sourceLabel}
              </div>
              ${article.link ? `<a class="card-link" href="${article.link}" target="_blank" rel="noopener noreferrer">
                Haberi oku
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </a>` : ''}
            </div>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });

    section.appendChild(grid);
    elCards.appendChild(section);
  });
}

function toggleThy(btn) {
  const panel = btn.nextElementSibling;
  const isOpen = panel.classList.toggle('show');
  btn.setAttribute('aria-expanded', isOpen);
  btn.innerHTML = `
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      style="transform:rotate(${isOpen ? 180 : 0}deg);transition:transform 0.2s"><polyline points="6 9 12 15 18 9"/></svg>
    ${isOpen ? 'Kapat' : 'Analiz'}
  `;
}

function updateStats(total, filtered) {
  const el = document.getElementById('header-stats');
  if (!el) return;
  el.innerHTML = filtered < total
    ? `<b>${filtered}</b> / ${total} haber`
    : `<b>${total}</b> haber`;
}

function buildDateTabs(articles) {
  const dates = [...new Set(articles.map(a => a.date).filter(Boolean))].sort((a, b) => b.localeCompare(a));
  if (dates.length <= 1) return;

  const bar  = document.getElementById('date-bar');
  const tabs = document.getElementById('date-tabs');
  bar.style.display = 'block';

  const allTab = document.createElement('div');
  allTab.className = 'date-tab active';
  allTab.textContent = 'Tüm Tarihler';
  allTab.dataset.date = 'all';
  tabs.appendChild(allTab);

  dates.forEach(d => {
    const tab = document.createElement('div');
    tab.className = 'date-tab';
    tab.textContent = formatDateShort(d);
    tab.dataset.date = d;
    tabs.appendChild(tab);
  });

  tabs.addEventListener('click', e => {
    const tab = e.target.closest('.date-tab');
    if (!tab) return;
    document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeDate = tab.dataset.date;
    render();
  });
}

function render() {
  const filtered = getFilteredArticles();
  renderCards(filtered);
  updateStats(allArticles.length, filtered.length);
}

// Category pills
document.querySelectorAll('.cat-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.cat-pill').forEach(p => {
      p.classList.remove('active');
      p.style.background = '';
      p.style.color = '';
    });
    pill.classList.add('active');
    if (pill.dataset.cat !== 'all') {
      const hex = CAT_HEX[pill.dataset.cat];
      if (hex) { pill.style.background = hex; pill.style.color = 'white'; pill.style.borderColor = 'transparent'; }
    }
    activeCat = pill.dataset.cat;
    render();
  });
});

// Search
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value;
    render();
  }, 220);
});

// Load data
const DATA_URL = 'https://n8n.emredemirbas.com/webhook/haber-ozetleri';

fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error('Veri kaynağına ulaşılamadı');
    return r.json();
  })
  .then(data => {
    allArticles = Array.isArray(data) ? data : (data.articles || []);
    buildDateTabs(allArticles);
    render();
  })
  .catch(err => {
    elLoading.innerHTML = `
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div style="color:#E63946;font-weight:600;font-size:14px">Veri yüklenemedi</div>
      <div style="font-size:12px;color:var(--text-3)">${err.message}</div>
    `;
  });
</script>
</body>
</html>
