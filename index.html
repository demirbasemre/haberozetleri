<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hava Kargo Bülteni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EF;
    --surface: #FFFFFF;
    --navy: #0D1117;
    --navy-soft: #161B22;
    --red: #E63946;
    --red-muted: rgba(230,57,70,0.08);
    --text: #111218;
    --text-2: #4B5563;
    --text-3: #9CA3AF;
    --border: #E9E8E4;
    --border-soft: #F0EFeb;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    --radius: 12px;
    --radius-sm: 6px;

    --cat-filo: #1D6FE8;
    --cat-tech: #7C3AED;
    --cat-ortak: #059669;
    --cat-ozel: #DB2777;
    --cat-alt: #EA580C;
    --cat-atama: #0891B2;
    --cat-diger: #6B7280;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ────────────────────────────────────── */
  header {
    background: var(--navy);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .site-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 18px;
    color: #FFFFFF;
    white-space: nowrap;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  .site-name span {
    color: var(--red);
  }

  .header-divider {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .search-wrap {
    flex: 1;
    max-width: 360px;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.3);
    pointer-events: none;
    width: 15px;
    height: 15px;
  }

  #search {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 12px 8px 34px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: background 0.2s, border-color 0.2s;
    touch-action: manipulation;
  }
  #search::placeholder { color: rgba(255,255,255,0.3); }
  #search:focus { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.22); }

  .header-stat {
    margin-left: auto;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .header-stat b { color: rgba(255,255,255,0.85); font-weight: 600; }

  /* ── FILTER BAR ──────────────────────────────── */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 60px;
    z-index: 90;
  }

  .filter-bar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-sep {
    width: 1px;
    height: 20px;
    background: var(--border);
    flex-shrink: 0;
    margin: 0 4px;
  }

  /* ── FILTER DROPDOWNS ────────────────────────── */
  .fdd-wrap { position: relative; flex-shrink: 0; }

  .fdd-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-family: 'Inter', sans-serif;
    transition: all 0.18s;
    min-height: 32px;
    touch-action: manipulation;
    user-select: none;
    white-space: nowrap;
  }
  .fdd-btn:hover { background: var(--bg); border-color: #d1d5db; color: var(--text); }
  .fdd-btn.active { background: var(--navy); color: white; border-color: transparent; }
  .fdd-btn.active:hover { background: #1a2332; }

  .fdd-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .fdd-chevron {
    opacity: 0.5;
    flex-shrink: 0;
    transition: transform 0.18s;
  }
  .fdd-btn[aria-expanded="true"] .fdd-chevron { transform: rotate(180deg); }

  .fdd-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    min-width: 200px;
    z-index: 9999;
    padding: 6px;
    display: none;
    max-height: 320px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .fdd-panel.open { display: block; animation: dropIn 0.16s ease; }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .fdd-panel.open { animation: none; } }

  .fdd-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text);
    user-select: none;
    min-height: 34px;
    transition: background 0.13s;
  }
  .fdd-option:hover { background: var(--bg); }
  .fdd-option.selected { background: rgba(13,17,23,0.05); font-weight: 500; }

  .fdd-radio {
    width: 15px;
    height: 15px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    transition: all 0.15s;
    background: white;
    box-sizing: border-box;
  }
  .fdd-option.selected .fdd-radio {
    border-color: var(--navy);
    background: var(--navy);
    box-shadow: inset 0 0 0 2.5px white, inset 0 0 0 5px var(--navy);
  }

  /* Airline multi-select */
  .dropdown-section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 4px 8px 2px;
  }

  .airline-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.13s;
    font-size: 12.5px;
    color: var(--text);
    user-select: none;
    min-height: 36px;
  }
  .airline-option:hover { background: var(--bg); }
  .airline-option.selected { background: rgba(13,17,23,0.05); }

  .airline-check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    background: white;
  }
  .airline-option.selected .airline-check { background: var(--navy); border-color: var(--navy); }
  .airline-option.selected .airline-check svg { display: block; }
  .airline-check svg { display: none; }
  .airline-label { flex: 1; line-height: 1.3; }

  .primary-badge {
    font-size: 9px;
    font-weight: 700;
    background: var(--red);
    color: white;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }

  .dropdown-divider { height: 1px; background: var(--border-soft); margin: 4px 0; }

  .airline-count {
    background: var(--red);
    color: white;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    min-width: 16px;
    text-align: center;
    line-height: 1.4;
  }

  /* Analysis toggle */
  .fdd-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-family: 'Inter', sans-serif;
    transition: all 0.18s;
    min-height: 32px;
    touch-action: manipulation;
    user-select: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .fdd-toggle:hover { background: var(--bg); border-color: #d1d5db; color: var(--text); }
  .fdd-toggle.active { background: #1a3a2a; color: #4ade80; border-color: transparent; }
  .fdd-toggle.active svg { stroke: #4ade80; }

  /* Clear filters */
  .clear-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    background: none;
    border: none;
    font-size: 11px;
    font-weight: 600;
    color: var(--red);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    padding: 4px 2px;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .clear-btn:hover { opacity: 0.7; }

  /* ── MAIN ────────────────────────────────────── */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 24px 72px;
  }

  /* ── DATE SECTION ────────────────────────────── */
  .date-section { margin-bottom: 52px; }

  .date-section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1.5px solid var(--border);
  }

  .date-heading {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 20px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .date-count {
    font-size: 12px;
    color: var(--text-3);
    font-weight: 400;
    background: var(--border-soft);
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ── ARTICLE GRID ────────────────────────────── */
  .article-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* ── ARTICLE CARD ────────────────────────────── */
  .article-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.35s ease both;
    cursor: default;
  }

  .article-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: transparent;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .article-card { animation: none; transition: none; }
    .article-card:hover { transform: none; }
  }

  /* Left accent bar */
  .card-accent {
    width: 3px;
    flex-shrink: 0;
    border-radius: 0;
    position: absolute;
    left: 0; top: 0; bottom: 0;
  }

  .card-inner {
    display: flex;
    flex-direction: row;
    flex: 1;
    position: relative;
  }

  .card-left-bar {
    width: 3px;
    flex-shrink: 0;
    border-radius: 12px 0 0 12px;
  }

  .card-body {
    padding: 16px 18px 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .card-cat-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
    color: white;
    text-transform: uppercase;
  }

  .dup-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 2px 7px;
    background: #FEF3C7;
    color: #92400E;
    border-radius: 4px;
    font-weight: 600;
  }

  /* Region badges on card */
  /* Etki Alanı section */
  .etki-alani {
    margin-top: 10px;
    margin-bottom: 4px;
  }
  .etki-alani-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-3);
    margin-bottom: 5px;
  }
  .region-groups {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }
  .region-group {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-wrap: wrap;
  }
  /* TK_Region (Bölge) label — solid colour */
  .region-tk {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 3px;
    color: #fff;
    white-space: nowrap;
  }
  .region-tk[data-tk="EUROPE"]      { background:#1D4ED8; }
  .region-tk[data-tk="FAR EAST"]    { background:#C2410C; }
  .region-tk[data-tk="MEASA"]       { background:#15803D; }
  .region-tk[data-tk="S&N AMERICA"] { background:#7E22CE; }
  .region-tk[data-tk="TURKIYE"]     { background:#BE123C; }
  /* Sub_Region (Alt Bölge) badge — light colour */
  .region-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .region-badge[data-tk="EUROPE"]      { background:#EFF6FF; color:#1D4ED8; }
  .region-badge[data-tk="FAR EAST"]    { background:#FFF7ED; color:#C2410C; }
  .region-badge[data-tk="MEASA"]       { background:#F0FDF4; color:#15803D; }
  .region-badge[data-tk="S&N AMERICA"] { background:#FDF4FF; color:#7E22CE; }
  .region-badge[data-tk="TURKIYE"]     { background:#FFF1F2; color:#BE123C; }

  /* Hierarchical region dropdown */
  .region-parent-opt {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    user-select: none;
    min-height: 34px;
    transition: background 0.13s;
  }
  .region-parent-opt:hover { background: var(--bg); }
  .region-parent-opt.selected { background: rgba(13,17,23,0.05); }
  .region-sub-opt {
    padding-left: 24px !important;
    font-size: 12px !important;
    color: var(--text-2) !important;
    min-height: 32px !important;
  }

  .card-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 15.5px;
    font-weight: 400;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .card-summary {
    font-size: 13px;
    line-height: 1.68;
    color: var(--text-2);
    flex: 1;
    margin-bottom: 14px;
  }

  .card-summary strong {
    color: var(--text);
    font-weight: 600;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
    gap: 8px;
  }

  .card-source {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
  }

  .source-favicon {
    width: 13px;
    height: 13px;
    border-radius: 2px;
    opacity: 0.75;
  }

  .card-link {
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: gap 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-link:hover { gap: 6px; }
  .card-link:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }

  /* Analysis trigger button — centered in card */
  .analysis-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
    background: #FFF8F8;
    border: 1px solid #fecaca;
    border-radius: 6px;
    font-size: 11px;
    color: var(--red);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    padding: 6px 0;
    margin-top: 10px;
    transition: background 0.15s, border-color 0.15s;
  }
  .analysis-toggle:hover { background: #fee2e2; border-color: #fca5a5; }
  .analysis-toggle:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* Analysis bottom drawer */
  .analysis-drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    background: #fff;
    border-top: 3px solid var(--red);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.14);
    max-height: 52vh;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    opacity: 0;
    transition: transform 260ms ease-out, opacity 220ms ease-out;
    pointer-events: none;
  }
  .analysis-drawer.open {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }
  .analysis-drawer-handle {
    width: 36px; height: 4px;
    background: #e2e8f0;
    border-radius: 2px;
    margin: 10px auto 0;
    flex-shrink: 0;
  }
  .analysis-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 8px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .analysis-drawer-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--red);
  }
  .analysis-drawer-close {
    background: none; border: none; cursor: pointer;
    color: var(--text-3); padding: 4px; line-height: 1;
    border-radius: 4px; transition: color 0.15s;
    font-size: 18px; font-weight: 300;
  }
  .analysis-drawer-close:hover { color: var(--text-1); }
  .analysis-drawer-body {
    padding: 14px 20px 24px;
    overflow-y: auto;
    font-size: 13px;
    line-height: 1.7;
    color: #7f1d1d;
    -webkit-overflow-scrolling: touch;
  }
  .analysis-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.18);
    z-index: 199;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms;
  }
  .analysis-backdrop.open { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) {
    .analysis-drawer, .analysis-backdrop { transition: none; }
  }

  /* ── LOADING ─────────────────────────────────── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 55vh;
    flex-direction: column;
    gap: 14px;
    color: var(--text-3);
    font-size: 13px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2.5px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  /* ── EMPTY STATE ─────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-3);
    display: none;
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.25; }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text-2); font-weight: 500; }
  .empty-state p { font-size: 13px; }

  /* ── FOOTER ──────────────────────────────────── */
  footer {
    background: var(--navy);
    color: rgba(255,255,255,0.3);
    text-align: center;
    padding: 20px 24px;
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  /* ── RESPONSIVE ──────────────────────────────── */
  @media (max-width: 768px) {
    .header-stat { display: none; }
    .header-divider { display: none; }
    .site-name { font-size: 16px; }
    .article-grid { grid-template-columns: 1fr; gap: 12px; }
    .main { padding: 20px 16px 56px; }
    .filter-bar-inner { padding: 8px 16px; }
    .header-inner { padding: 0 16px; gap: 12px; }
    .fdd-panel { min-width: 180px; }
  }

  @media (max-width: 480px) {
    .search-wrap { max-width: none; }
    .clear-btn span { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-name">Hava Kargo<span> Bülteni</span></div>
    <div class="header-divider"></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search" placeholder="Haberlerde ara…" autocomplete="off">
    </div>
    <div class="header-stat" id="header-stats"></div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-bar-inner">

    <!-- Kategori -->
    <div class="fdd-wrap">
      <button class="fdd-btn" id="cat-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Kategori filtresi">
        <span class="fdd-dot" id="cat-dot" style="background:var(--red)"></span>
        <span id="cat-btn-label">Kategori</span>
        <svg class="fdd-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="fdd-panel" id="cat-panel" role="listbox" aria-label="Kategori seç">
        <div class="fdd-option selected" data-cat="all" role="option" aria-selected="true">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--red)"></span>
          Tümü
        </div>
        <div class="fdd-option" data-cat="Filo & Network" role="option" aria-selected="false">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--cat-filo)"></span>
          Filo &amp; Network
        </div>
        <div class="fdd-option" data-cat="Teknoloji & Dijitalleşme" role="option" aria-selected="false">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--cat-tech)"></span>
          Teknoloji
        </div>
        <div class="fdd-option" data-cat="Ortaklık & İş Birlikleri" role="option" aria-selected="false">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--cat-ortak)"></span>
          Ortaklık
        </div>
        <div class="fdd-option" data-cat="Özel Kargo" role="option" aria-selected="false">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--cat-ozel)"></span>
          Özel Kargo
        </div>
        <div class="fdd-option" data-cat="Altyapı" role="option" aria-selected="false">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--cat-alt)"></span>
          Altyapı
        </div>
        <div class="fdd-option" data-cat="Atama & Görevlendirme" role="option" aria-selected="false">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--cat-atama)"></span>
          Atama
        </div>
        <div class="fdd-option" data-cat="Diğer" role="option" aria-selected="false">
          <div class="fdd-radio"></div>
          <span class="fdd-dot" style="background:var(--cat-diger)"></span>
          Diğer
        </div>
      </div>
    </div>

    <!-- Tarih -->
    <div class="fdd-wrap">
      <button class="fdd-btn" id="date-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Tarih filtresi">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span id="date-btn-label">Tarih</span>
        <svg class="fdd-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="fdd-panel" id="date-panel" role="listbox" aria-label="Tarih seç">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Bölge -->
    <div class="fdd-wrap">
      <button class="fdd-btn" id="region-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Etki alanı filtresi">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="region-btn-label">Etki Alanı</span>
        <svg class="fdd-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="fdd-panel" id="region-panel" role="listbox" aria-multiselectable="true" aria-label="Etki alanı seç" style="min-width:230px">
        <!-- Populated by buildRegionDropdown() -->
      </div>
    </div>

    <!-- Havayolu -->
    <div class="fdd-wrap">
      <button class="fdd-btn" id="airline-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Havayolu filtresi">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21 4 19.5 2.5c-1.5-1.5-3.5-1.5-5 0L11 6 2.8 4.2l-1.4 1.4 4.9 4.9-.4.4-2.1-.7-.9.9 3 3-1.2 1.2 1.8 1.8 1.2-1.2 3 3 .9-.9-.7-2.1.4-.4 4.9 4.9 1.4-1.4Z"/>
        </svg>
        <span id="airline-btn-label">Havayolu</span>
        <svg class="fdd-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="fdd-panel" id="airline-dropdown" role="listbox" aria-multiselectable="true" aria-label="Havayolu seç">
        <!-- Populated by JS -->
      </div>
    </div>

    <div class="filter-sep"></div>

    <!-- Analiz toggle -->
    <button class="fdd-toggle" id="analysis-toggle" aria-pressed="false">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Analizli Haberler
    </button>

    <!-- Clear all -->
    <button class="clear-btn" id="clear-filters" style="display:none" aria-label="Tüm filtreleri temizle">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
      <span>Temizle</span>
    </button>

  </div>
</div>

<main class="main" id="main">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Haberler yükleniyor…</div>
  </div>
  <div class="empty-state" id="empty-state">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <h3>Sonuç bulunamadı</h3>
    <p>Farklı arama veya filtre deneyin.</p>
  </div>
  <div id="cards-container"></div>
</main>

<footer>
  Bülten yapay zeka tarafından otomatik oluşturulmuştur. İçeriğin doğruluğu garanti edilmez.
</footer>

<script>
const CAT_COLORS = {
  'Filo & Network':           'var(--cat-filo)',
  'Teknoloji & Dijitalleşme': 'var(--cat-tech)',
  'Ortaklık & İş Birlikleri': 'var(--cat-ortak)',
  'Özel Kargo':               'var(--cat-ozel)',
  'Altyapı':                  'var(--cat-alt)',
  'Atama & Görevlendirme':    'var(--cat-atama)',
  'Diğer':                    'var(--cat-diger)'
};

const CAT_HEX = {
  'Filo & Network':           '#1D6FE8',
  'Teknoloji & Dijitalleşme': '#7C3AED',
  'Ortaklık & İş Birlikleri': '#059669',
  'Özel Kargo':               '#DB2777',
  'Altyapı':                  '#EA580C',
  'Atama & Görevlendirme':    '#0891B2',
  'Diğer':                    '#6B7280'
};

const SOURCE_LABELS = {
  'aircargonews':   'AirCargoNews',
  'aircargoweek':   'AirCargoWeek',
  'stattimes':      'StatTimes',
  'aircargoupdate': 'AirCargoUpdate',
  'payloadasia':    'PayloadAsia'
};

let allArticles    = [];
let activeCat      = 'all';
let activeDate     = 'all';
let searchQuery    = '';
let activeAirlines = new Set();
let activeRegions  = new Set();
let onlyAnalysis   = false;

// ── Region hierarchy (matches Bölge Yapısı table) ───────────
const TK_HIERARCHY = [
  { id: 'EUROPE',      label: 'EUROPE',      subs: ['Central Europe','Eastern Europe','Northern Europe','Western Europe'] },
  { id: 'FAR EAST',    label: 'FAR EAST',    subs: ['China','North East Asia','South East Asia','Turkistan and Russia'] },
  { id: 'MEASA',       label: 'MEASA',       subs: ['Middle East','Northern & Western Africa','Southern & Eastern Africa','Southern Asia'] },
  { id: 'S&N AMERICA', label: 'S&N AMERICA', subs: ['Central & Southern America','Northern America'] },
  { id: 'TURKIYE',     label: 'TÜRKİYE',     subs: ['ANKARA','CUKUROVA','IZMIR'] }
];

// Sub_Region → parent TK_Region lookup
const SUB_TO_TK = {};
TK_HIERARCHY.forEach(tk => tk.subs.forEach(s => { SUB_TO_TK[s] = tk.id; }));
// Also map TK_Region IDs to themselves for backward compat (old articles)
TK_HIERARCHY.forEach(tk => { SUB_TO_TK[tk.id] = tk.id; });

// ── Airline keyword definitions ──────────────────────────────
const AIRLINE_DEFS = [
  { id: 'turkishairlines', label: 'Turkish Airlines', isPrimary: true,
    kw: ['turkish cargo','turkish airlines','türk hava','türk kargo'] },
  { id: 'fedex',     label: 'FedEx',          kw: ['fedex'] },
  { id: 'ups',       label: 'UPS',            kw: [' ups ',' ups,', 'ups kargo'] },
  { id: 'dhl',       label: 'DHL',            kw: ['dhl'] },
  { id: 'emirates',  label: 'Emirates',       kw: ['emirates'] },
  { id: 'qatar',     label: 'Qatar Airways',  kw: ['qatar airways','qatar cargo'] },
  { id: 'lufthansa', label: 'Lufthansa',      kw: ['lufthansa'] },
  { id: 'cathay',    label: 'Cathay Pacific', kw: ['cathay'] },
  { id: 'atlas',     label: 'Atlas Air',      kw: ['atlas air'] },
  { id: 'airfrance', label: 'Air France',     kw: ['air france'] },
  { id: 'korean',    label: 'Korean Air',     kw: ['korean air'] },
  { id: 'singapore', label: 'Singapore Airlines', kw: ['singapore airlines'] },
  { id: 'cargolux',  label: 'Cargolux',       kw: ['cargolux'] },
  { id: 'amazon',    label: 'Amazon Air',     kw: ['amazon air'] },
  { id: 'geosky',    label: 'Geosky',         kw: ['geosky'] },
  { id: 'wizz',      label: 'Wizz Air',       kw: ['wizz air'] },
  { id: 'ecs',       label: 'ECS Group',      kw: ['ecs group'] },
  { id: 'menzies',   label: 'Menzies',        kw: ['menzies'] },
  { id: 'cargojet',  label: 'Cargojet',       kw: ['cargojet'] },
  { id: 'aeromexico',label: 'Aeromexico',     kw: ['aeromexico'] },
];

function detectAirlines(article) {
  const text = (' ' + stripHtml(article.title || '') + ' ' + stripHtml(article.summary || '') + ' ').toLowerCase();
  return AIRLINE_DEFS.filter(a => a.kw.some(kw => text.includes(kw))).map(a => a.id);
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
}

function getFavicon(source) {
  const domains = {
    'aircargonews':   'aircargonews.net',
    'aircargoweek':   'aircargoweek.com',
    'stattimes':      'stattimes.com',
    'aircargoupdate': 'aircargoupdate.com',
    'payloadasia':    'payloadasia.com'
  };
  const domain = domains[source] || source;
  return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function getFilteredArticles() {
  return allArticles.filter(a => {
    const catMatch      = activeCat === 'all' || a.category === activeCat;
    const dateMatch     = activeDate === 'all' || a.date === activeDate;
    const airlineMatch  = activeAirlines.size === 0 ||
                          (a._airlines && a._airlines.some(id => activeAirlines.has(id)));
    const regionMatch   = activeRegions.size === 0 ||
                          (Array.isArray(a.etkiAlani) && a.etkiAlani.some(r => {
                            if (activeRegions.has(r)) return true;
                            // backward compat: old articles store TK_Region; expand to its subs
                            const tk = TK_HIERARCHY.find(t => t.id === r);
                            return tk ? tk.subs.some(s => activeRegions.has(s)) : false;
                          }));
    const analysisMatch = !onlyAnalysis ||
                          (a.impact && a.impact !== 'notr') ||
                          (a.analysis && a.analysis.trim() !== '');
    const q = searchQuery.toLowerCase();
    const searchMatch = !q ||
      stripHtml(a.title   || '').toLowerCase().includes(q) ||
      stripHtml(a.summary || '').toLowerCase().includes(q) ||
      (a.source || '').toLowerCase().includes(q);
    return catMatch && dateMatch && airlineMatch && regionMatch && analysisMatch && searchMatch;
  });
}

const elLoading = document.getElementById('loading');
const elEmpty   = document.getElementById('empty-state');
const elCards   = document.getElementById('cards-container');

function renderCards(articles) {
  elLoading.style.display = 'none';

  const byDate = {};
  articles.forEach(a => {
    const d = a.date || 'Tarihsiz';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(a);
  });

  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));

  if (articles.length === 0) {
    elCards.innerHTML = '';
    elEmpty.style.display = 'block';
    return;
  }

  elEmpty.style.display = 'none';
  elCards.innerHTML = '';

  dates.forEach(date => {
    const section = document.createElement('div');
    section.className = 'date-section';

    const hdr = document.createElement('div');
    hdr.className = 'date-section-header';
    hdr.innerHTML = `
      <div class="date-heading">${formatDate(date)}</div>
      <div class="date-count">${byDate[date].length} haber</div>
    `;
    section.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'article-grid';

    byDate[date].forEach((article, i) => {
      const hex   = CAT_HEX[article.category] || '#6B7280';
      const hasAnalysis = article.impact && article.impact !== 'notr' && article.analysis;
      const sourceLabel = SOURCE_LABELS[article.source] || article.source || '';

      const card = document.createElement('div');
      card.className = 'article-card';
      card.style.animationDelay = `${i * 35}ms`;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-left-bar" style="background:${hex}"></div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-cat-badge" style="background:${hex}">${article.category || 'Diğer'}</span>
              ${article.isDuplicate ? `<span class="dup-badge">↺ Tekrar haber</span>` : ''}
            </div>
            <div class="card-title">${article.title || ''}</div>
            <div class="card-summary">${article.summary || '<em style="color:var(--text-3)">Özet henüz oluşturulmadı.</em>'}</div>
            ${(() => {
              const subs = (article.etkiAlani || []).map(r => typeof r === 'string' ? r : (r.Sub_Region || r.sub_region || r.region || r.name || '')).filter(Boolean);
              if (!subs.length) return '';
              const grouped = {};
              const order = [];
              subs.forEach(rs => {
                const tk = SUB_TO_TK[rs] || 'OTHER';
                if (!grouped[tk]) { grouped[tk] = []; order.push(tk); }
                grouped[tk].push(rs);
              });
              const groupsHTML = order.map(tkId => {
                const tkEntry = TK_HIERARCHY.find(t => t.id === tkId);
                const tkLabel = tkEntry ? tkEntry.label : tkId;
                const subBadges = grouped[tkId].map(rs => {
                  const lbl = rs === 'TURKIYE' ? 'TÜRKİYE' : rs;
                  return `<span class="region-badge" data-tk="${tkId}">${lbl}</span>`;
                }).join('');
                return `<div class="region-group"><span class="region-tk" data-tk="${tkId}">${tkLabel}</span>${subBadges}</div>`;
              }).join('');
              return `<div class="etki-alani"><div class="etki-alani-title">Etki Alanı</div><div class="region-groups">${groupsHTML}</div></div>`;
            })()}
            ${hasAnalysis ? `
              <button class="analysis-toggle" onclick="openAnalysisDrawer(this)" data-analysis="${(article.analysis||'').replace(/"/g,'&quot;')}" aria-label="Analizi göster">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                Analiz
              </button>
            ` : ''}
            <div class="card-footer">
              <div class="card-source">
                <img class="source-favicon" src="${getFavicon(article.source)}" alt="" loading="lazy" onerror="this.style.display='none'">
                ${sourceLabel}
              </div>
              ${article.link ? `<a class="card-link" href="${article.link}" target="_blank" rel="noopener noreferrer">
                Haberi oku
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </a>` : ''}
            </div>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });

    section.appendChild(grid);
    elCards.appendChild(section);
  });
}


function updateStats(total, filtered) {
  const el = document.getElementById('header-stats');
  if (!el) return;
  el.innerHTML = filtered < total
    ? `<b>${filtered}</b> / ${total} haber`
    : `<b>${total}</b> haber`;
}

const CAT_SHORT = {
  'all':                      'Kategori',
  'Filo & Network':           'Filo & Network',
  'Teknoloji & Dijitalleşme': 'Teknoloji',
  'Ortaklık & İş Birlikleri': 'Ortaklık',
  'Özel Kargo':               'Özel Kargo',
  'Altyapı':                  'Altyapı',
  'Atama & Görevlendirme':    'Atama',
  'Diğer':                    'Diğer'
};

// ── Dropdown management ──────────────────────────────────────
const ALL_DROPDOWNS = ['cat', 'date', 'region', 'airline'];
function panelId(id) { return id === 'airline' ? 'airline-dropdown' : `${id}-panel`; }

function closeDropdown(id) {
  document.getElementById(panelId(id))?.classList.remove('open');
  document.getElementById(`${id}-btn`)?.setAttribute('aria-expanded', 'false');
}
function openDropdown(id) {
  ALL_DROPDOWNS.forEach(d => { if (d !== id) closeDropdown(d); });
  document.getElementById(panelId(id))?.classList.add('open');
  document.getElementById(`${id}-btn`)?.setAttribute('aria-expanded', 'true');
}
function closeAllDropdowns() { ALL_DROPDOWNS.forEach(closeDropdown); }

function buildDateDropdown(articles) {
  const dates = [...new Set(articles.map(a => a.date).filter(Boolean))].sort((a, b) => b.localeCompare(a));
  const panel = document.getElementById('date-panel');
  panel.innerHTML = '';

  const allOpt = document.createElement('div');
  allOpt.className = 'fdd-option selected';
  allOpt.dataset.date = 'all';
  allOpt.setAttribute('role', 'option');
  allOpt.setAttribute('aria-selected', 'true');
  allOpt.innerHTML = `<div class="fdd-radio"></div><span>Tüm Tarihler</span>`;
  panel.appendChild(allOpt);

  dates.forEach(d => {
    const opt = document.createElement('div');
    opt.className = 'fdd-option';
    opt.dataset.date = d;
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', 'false');
    opt.innerHTML = `<div class="fdd-radio"></div><span>${formatDate(d)}</span>`;
    panel.appendChild(opt);
  });

  panel.addEventListener('click', e => {
    const opt = e.target.closest('.fdd-option');
    if (!opt) return;
    document.querySelectorAll('#date-panel .fdd-option').forEach(o => {
      o.classList.remove('selected');
      o.setAttribute('aria-selected', 'false');
    });
    opt.classList.add('selected');
    opt.setAttribute('aria-selected', 'true');
    activeDate = opt.dataset.date;
    const btn = document.getElementById('date-btn');
    const lbl = document.getElementById('date-btn-label');
    if (activeDate === 'all') {
      lbl.textContent = 'Tarih';
      btn.classList.remove('active');
    } else {
      lbl.textContent = formatDateShort(activeDate);
      btn.classList.add('active');
    }
    closeDropdown('date');
    syncClearBtn();
    render();
  });
}

function render() {
  const filtered = getFilteredArticles();
  renderCards(filtered);
  updateStats(allArticles.length, filtered.length);
}

// ── Airline filter builder ───────────────────────────────────
function buildAirlineFilter(articles) {
  // Tag each article with matching airlines
  articles.forEach(a => { a._airlines = detectAirlines(a); });

  // Find which airline IDs actually appear in the data
  const found = new Set();
  articles.forEach(a => a._airlines.forEach(id => found.add(id)));

  const relevant = AIRLINE_DEFS.filter(a => found.has(a.id));
  if (relevant.length === 0) return;

  // Sort: primary airline first, then alphabetical
  relevant.sort((a, b) => {
    if (a.isPrimary) return -1;
    if (b.isPrimary) return 1;
    return a.label.localeCompare(b.label, 'tr');
  });

  const dropdown = document.getElementById('airline-dropdown');
  dropdown.innerHTML = '';

  // Section label
  const lbl = document.createElement('div');
  lbl.className = 'dropdown-section-label';
  lbl.textContent = 'Havayolu Seç';
  dropdown.appendChild(lbl);

  relevant.forEach((airline, idx) => {
    // Divider after primary airline
    if (idx > 0 && !airline.isPrimary && relevant[idx - 1].isPrimary) {
      const div = document.createElement('div');
      div.className = 'dropdown-divider';
      dropdown.appendChild(div);
    }

    const opt = document.createElement('div');
    opt.className = 'airline-option';
    opt.dataset.id = airline.id;
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', 'false');
    opt.innerHTML = `
      <div class="airline-check">
        <svg width="9" height="7" viewBox="0 0 9 7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 3.5 3.5 6 8 1"/>
        </svg>
      </div>
      <span class="airline-label">${airline.label}</span>
    `;

    opt.addEventListener('click', e => {
      e.stopPropagation();
      if (activeAirlines.has(airline.id)) {
        activeAirlines.delete(airline.id);
        opt.classList.remove('selected');
        opt.setAttribute('aria-selected', 'false');
      } else {
        activeAirlines.add(airline.id);
        opt.classList.add('selected');
        opt.setAttribute('aria-selected', 'true');
      }
      syncAirlineBtn();
      render();
    });

    dropdown.appendChild(opt);
  });

  // (filter bar is always visible)
}

function syncAirlineBtn() {
  const btn   = document.getElementById('airline-btn');
  const lbl   = document.getElementById('airline-btn-label');
  const count = activeAirlines.size;
  btn.querySelector('.airline-count')?.remove();

  if (count > 0) {
    btn.classList.add('active');
    lbl.textContent = count === 1
      ? AIRLINE_DEFS.find(a => activeAirlines.has(a.id))?.label || 'Havayolu'
      : `${count} Havayolu`;
    const badge = document.createElement('span');
    badge.className = 'airline-count';
    badge.textContent = count;
    btn.insertBefore(badge, btn.querySelector('.fdd-chevron'));
  } else {
    btn.classList.remove('active');
    lbl.textContent = 'Havayolu';
  }
  syncClearBtn();
}

function syncClearBtn() {
  const hasAny = activeAirlines.size > 0 || activeRegions.size > 0 || onlyAnalysis || activeCat !== 'all' || activeDate !== 'all';
  document.getElementById('clear-filters').style.display = hasAny ? 'inline-flex' : 'none';
}

const CHECK_SVG = `<svg width="9" height="7" viewBox="0 0 9 7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 3.5 3.5 6 8 1"/></svg>`;

function buildRegionDropdown() {
  const panel = document.getElementById('region-panel');
  panel.innerHTML = '';

  TK_HIERARCHY.forEach(tk => {
    // Parent row
    const par = document.createElement('div');
    par.className = 'region-parent-opt';
    par.dataset.tk = tk.id;
    par.innerHTML = `<div class="airline-check">${CHECK_SVG}</div><span class="airline-label" style="font-weight:600">${tk.label}</span>`;
    par.addEventListener('click', e => { e.stopPropagation(); toggleTkRegion(tk); });
    panel.appendChild(par);

    // Sub rows
    tk.subs.forEach(sub => {
      const row = document.createElement('div');
      row.className = 'airline-option region-sub-opt';
      row.dataset.sub = sub;
      row.dataset.tk  = tk.id;
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', 'false');
      row.innerHTML = `<div class="airline-check">${CHECK_SVG}</div><span class="airline-label">${sub}</span>`;
      row.addEventListener('click', e => { e.stopPropagation(); toggleSubRegion(sub, tk); });
      panel.appendChild(row);
    });
  });
}

function toggleTkRegion(tk) {
  const allSel = tk.subs.every(s => activeRegions.has(s));
  if (allSel) { tk.subs.forEach(s => activeRegions.delete(s)); }
  else        { tk.subs.forEach(s => activeRegions.add(s)); }
  syncRegionUI();
  syncRegionBtn();
  render();
}

function toggleSubRegion(sub, tk) {
  if (activeRegions.has(sub)) activeRegions.delete(sub);
  else activeRegions.add(sub);
  syncRegionUI();
  syncRegionBtn();
  render();
}

function syncRegionUI() {
  TK_HIERARCHY.forEach(tk => {
    const allSel = tk.subs.every(s => activeRegions.has(s));
    const anySel = tk.subs.some(s => activeRegions.has(s));

    const par = document.querySelector(`.region-parent-opt[data-tk="${tk.id}"]`);
    if (par) {
      par.classList.toggle('selected', anySel);
      const ch = par.querySelector('.airline-check');
      if (anySel) {
        ch.style.background = 'var(--navy)';
        ch.style.borderColor = 'var(--navy)';
        ch.querySelector('svg').style.display = allSel ? 'block' : 'none';
        // partial: show a dash indicator
        if (!allSel) {
          ch.style.background = 'var(--navy)';
          ch.innerHTML = `<span style="width:7px;height:2px;background:white;border-radius:1px;display:block"></span>`;
        } else {
          ch.innerHTML = CHECK_SVG;
        }
      } else {
        ch.style.background = '';
        ch.style.borderColor = '';
        ch.innerHTML = CHECK_SVG;
        ch.querySelector('svg').style.display = 'none';
      }
    }

    tk.subs.forEach(sub => {
      const row = document.querySelector(`.region-sub-opt[data-sub="${CSS.escape(sub)}"]`);
      if (!row) return;
      const isSel = activeRegions.has(sub);
      row.classList.toggle('selected', isSel);
      row.setAttribute('aria-selected', isSel ? 'true' : 'false');
      const ch = row.querySelector('.airline-check');
      ch.style.background   = isSel ? 'var(--navy)' : '';
      ch.style.borderColor  = isSel ? 'var(--navy)' : '';
      ch.innerHTML = CHECK_SVG;
      ch.querySelector('svg').style.display = isSel ? 'block' : 'none';
    });
  });
}

function syncRegionBtn() {
  const btn   = document.getElementById('region-btn');
  const lbl   = document.getElementById('region-btn-label');
  const count = activeRegions.size;
  btn.querySelector('.airline-count')?.remove();
  if (count > 0) {
    btn.classList.add('active');
    // Show TK region name if all its subs are selected
    const fullTk = TK_HIERARCHY.find(tk => tk.subs.every(s => activeRegions.has(s)) && tk.subs.some(s => activeRegions.has(s)));
    if (count === 1) lbl.textContent = [...activeRegions][0];
    else if (fullTk && count === fullTk.subs.length) lbl.textContent = fullTk.label;
    else lbl.textContent = `${count} Alt Bölge`;
    const badge = document.createElement('span');
    badge.className = 'airline-count';
    badge.textContent = count;
    btn.insertBefore(badge, btn.querySelector('.fdd-chevron'));
  } else {
    btn.classList.remove('active');
    lbl.textContent = 'Etki Alanı';
  }
  syncClearBtn();
}

// ── Dropdown button click handlers ──────────────────────────
document.getElementById('cat-btn').addEventListener('click', e => {
  e.stopPropagation();
  const isOpen = document.getElementById('cat-panel').classList.contains('open');
  if (isOpen) closeDropdown('cat'); else openDropdown('cat');
});

document.getElementById('cat-panel').addEventListener('click', e => {
  const opt = e.target.closest('.fdd-option');
  if (!opt) return;
  document.querySelectorAll('#cat-panel .fdd-option').forEach(o => {
    o.classList.remove('selected');
    o.setAttribute('aria-selected', 'false');
  });
  opt.classList.add('selected');
  opt.setAttribute('aria-selected', 'true');
  activeCat = opt.dataset.cat;
  const btn = document.getElementById('cat-btn');
  const lbl = document.getElementById('cat-btn-label');
  const dot = document.getElementById('cat-dot');
  if (activeCat === 'all') {
    lbl.textContent = 'Kategori';
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
    dot.style.background = 'var(--red)';
  } else {
    const hex = CAT_HEX[activeCat] || '#6B7280';
    lbl.textContent = CAT_SHORT[activeCat] || activeCat;
    btn.style.background = hex;
    btn.style.borderColor = 'transparent';
    btn.style.color = 'white';
    dot.style.background = 'rgba(255,255,255,0.6)';
  }
  closeDropdown('cat');
  syncClearBtn();
  render();
});

document.getElementById('date-btn').addEventListener('click', e => {
  e.stopPropagation();
  const isOpen = document.getElementById('date-panel').classList.contains('open');
  if (isOpen) closeDropdown('date'); else openDropdown('date');
});

// Region dropdown
document.getElementById('region-btn').addEventListener('click', e => {
  e.stopPropagation();
  const isOpen = document.getElementById('region-panel').classList.contains('open');
  if (isOpen) closeDropdown('region'); else openDropdown('region');
});
// (region-panel click events are attached in buildRegionDropdown)

document.getElementById('airline-btn').addEventListener('click', e => {
  e.stopPropagation();
  const isOpen = document.getElementById('airline-dropdown').classList.contains('open');
  if (isOpen) closeDropdown('airline'); else openDropdown('airline');
});

// Close all dropdowns on outside click or Escape
document.addEventListener('click', closeAllDropdowns);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeAllDropdowns();
});

// Analysis toggle
document.getElementById('analysis-toggle').addEventListener('click', () => {
  onlyAnalysis = !onlyAnalysis;
  const btn = document.getElementById('analysis-toggle');
  btn.classList.toggle('active', onlyAnalysis);
  btn.setAttribute('aria-pressed', onlyAnalysis);
  syncClearBtn();
  render();
});

// Clear all filters
document.getElementById('clear-filters').addEventListener('click', () => {
  activeAirlines.clear();
  activeRegions.clear();
  onlyAnalysis = false;
  activeCat = 'all';
  activeDate = 'all';

  // Reset region
  syncRegionUI();
  syncRegionBtn();

  // Reset category
  document.querySelectorAll('#cat-panel .fdd-option').forEach(o => {
    const isAll = o.dataset.cat === 'all';
    o.classList.toggle('selected', isAll);
    o.setAttribute('aria-selected', isAll ? 'true' : 'false');
  });
  const catBtn = document.getElementById('cat-btn');
  catBtn.style.background = '';
  catBtn.style.borderColor = '';
  catBtn.style.color = '';
  document.getElementById('cat-btn-label').textContent = 'Kategori';
  document.getElementById('cat-dot').style.background = 'var(--red)';

  // Reset date
  document.querySelectorAll('#date-panel .fdd-option').forEach(o => {
    const isAll = o.dataset.date === 'all';
    o.classList.toggle('selected', isAll);
    o.setAttribute('aria-selected', isAll ? 'true' : 'false');
  });
  document.getElementById('date-btn').classList.remove('active');
  document.getElementById('date-btn-label').textContent = 'Tarih';

  // Reset airline
  document.querySelectorAll('.airline-option.selected').forEach(o => {
    o.classList.remove('selected');
    o.setAttribute('aria-selected', 'false');
  });

  // Reset analysis
  const toggle = document.getElementById('analysis-toggle');
  toggle.classList.remove('active');
  toggle.setAttribute('aria-pressed', 'false');

  syncAirlineBtn();
  syncClearBtn();
  render();
});

// Search
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value;
    render();
  }, 220);
});

// Build region dropdown immediately (static data)
buildRegionDropdown();

// Load data
const DATA_URL = 'data.json';

fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error('Veri kaynağına ulaşılamadı');
    return r.json();
  })
  .then(data => {
    allArticles = Array.isArray(data) ? data : (data.articles || []);
    buildDateDropdown(allArticles);
    buildAirlineFilter(allArticles);
    render();
  })
  .catch(err => {
    elLoading.innerHTML = `
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div style="color:#E63946;font-weight:600;font-size:14px">Veri yüklenemedi</div>
      <div style="font-size:12px;color:var(--text-3)">${err.message}</div>
    `;
  });
</script>

<!-- Analysis Bottom Drawer -->
<div class="analysis-backdrop" id="analysisBd" onclick="closeAnalysisDrawer()"></div>
<div class="analysis-drawer" id="analysisDrawer" role="dialog" aria-modal="true" aria-label="Analiz">
  <div class="analysis-drawer-handle"></div>
  <div class="analysis-drawer-header">
    <span class="analysis-drawer-label">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-1px;margin-right:4px"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      Analiz
    </span>
    <button class="analysis-drawer-close" onclick="closeAnalysisDrawer()" aria-label="Kapat">&#x2715;</button>
  </div>
  <div class="analysis-drawer-body" id="analysisDrawerBody"></div>
</div>

<script>
function openAnalysisDrawer(btn) {
  const text = btn.getAttribute('data-analysis') || '';
  document.getElementById('analysisDrawerBody').innerHTML = text;
  document.getElementById('analysisDrawer').classList.add('open');
  document.getElementById('analysisBd').classList.add('open');
  document.getElementById('analysisDrawer').focus();
}
function closeAnalysisDrawer() {
  document.getElementById('analysisDrawer').classList.remove('open');
  document.getElementById('analysisBd').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAnalysisDrawer(); });
</script>
