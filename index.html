<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hava Kargo Bülteni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EF;
    --surface: #FFFFFF;
    --navy: #0D1117;
    --navy-soft: #161B22;
    --red: #E63946;
    --red-muted: rgba(230,57,70,0.08);
    --text: #111218;
    --text-2: #4B5563;
    --text-3: #9CA3AF;
    --border: #E9E8E4;
    --border-soft: #F0EFeb;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
    --radius: 12px;
    --radius-sm: 6px;

    --cat-filo: #1D6FE8;
    --cat-tech: #7C3AED;
    --cat-ortak: #059669;
    --cat-ozel: #DB2777;
    --cat-alt: #EA580C;
    --cat-atama: #0891B2;
    --cat-diger: #6B7280;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ────────────────────────────────────── */
  header {
    background: var(--navy);
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .site-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 18px;
    color: #FFFFFF;
    white-space: nowrap;
    letter-spacing: -0.01em;
    flex-shrink: 0;
  }

  .site-name span {
    color: var(--red);
  }

  .header-divider {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .search-wrap {
    flex: 1;
    max-width: 360px;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.3);
    pointer-events: none;
    width: 15px;
    height: 15px;
  }

  #search {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 12px 8px 34px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: background 0.2s, border-color 0.2s;
    touch-action: manipulation;
  }
  #search::placeholder { color: rgba(255,255,255,0.3); }
  #search:focus { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.22); }

  .header-stat {
    margin-left: auto;
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .header-stat b { color: rgba(255,255,255,0.85); font-weight: 600; }

  /* ── DATE TABS ───────────────────────────────── */
  .date-bar {
    background: var(--navy-soft);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: none;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .date-bar::-webkit-scrollbar { display: none; }

  .date-tabs {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 0;
  }

  .date-tab {
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: color 0.15s;
    letter-spacing: 0.01em;
    user-select: none;
    touch-action: manipulation;
  }
  .date-tab:hover { color: rgba(255,255,255,0.7); }
  .date-tab.active { color: #fff; border-bottom-color: var(--red); }

  /* ── FILTER BAR ──────────────────────────────── */
  .filter-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 60px;
    z-index: 90;
  }

  .filter-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    align-items: center;
  }
  .filter-inner::-webkit-scrollbar { display: none; }

  .filter-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-right: 4px;
  }

  .cat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    flex-shrink: 0;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-2);
    user-select: none;
    touch-action: manipulation;
    min-height: 30px;
  }

  .cat-pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .cat-pill:hover { background: var(--bg); border-color: #d1d5db; color: var(--text); }

  .cat-pill.active {
    color: white;
    border-color: transparent;
    box-shadow: var(--shadow-sm);
  }
  .cat-pill[data-cat="all"] .dot { background: var(--red); }
  .cat-pill[data-cat="all"].active { background: var(--red); }

  /* ── FILTER ROW 2 ────────────────────────────── */
  .filter-row-2 {
    border-top: 1px solid var(--border-soft);
    padding: 8px 24px;
    display: none;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Airline dropdown trigger */
  .airline-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 11px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-family: 'Inter', sans-serif;
    transition: all 0.18s;
    min-height: 30px;
    touch-action: manipulation;
    user-select: none;
    position: relative;
  }
  .airline-btn:hover { background: var(--bg); border-color: #d1d5db; color: var(--text); }
  .airline-btn.has-filter { background: var(--navy); color: white; border-color: transparent; }
  .airline-btn.has-filter:hover { background: #1a2332; }

  .airline-btn #airline-chevron {
    transition: transform 0.18s;
    opacity: 0.6;
  }

  .airline-count {
    background: var(--red);
    color: white;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 5px;
    min-width: 16px;
    text-align: center;
    line-height: 1.4;
  }

  /* Airline dropdown panel */
  .airline-dropdown-wrap { position: relative; }

  .airline-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    width: 260px;
    z-index: 200;
    padding: 6px;
    display: none;
    max-height: 300px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .airline-dropdown.open { display: block; animation: dropIn 0.16s ease; }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) { .airline-dropdown.open { animation: none; } }

  .dropdown-section-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 4px 8px 2px;
  }

  .airline-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 8px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.13s;
    font-size: 12.5px;
    color: var(--text);
    user-select: none;
    min-height: 36px;
  }
  .airline-option:hover { background: var(--bg); }
  .airline-option.selected { background: rgba(13,17,23,0.05); }

  .airline-check {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
    background: white;
  }
  .airline-option.selected .airline-check {
    background: var(--navy);
    border-color: var(--navy);
  }
  .airline-option.selected .airline-check svg { display: block; }
  .airline-check svg { display: none; }

  .airline-label { flex: 1; line-height: 1.3; }

  .thy-badge {
    font-size: 9px;
    font-weight: 700;
    background: var(--red);
    color: white;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }

  .dropdown-divider {
    height: 1px;
    background: var(--border-soft);
    margin: 4px 0;
  }

  /* Analysis toggle */
  .analysis-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-2);
    font-family: 'Inter', sans-serif;
    transition: all 0.18s;
    min-height: 30px;
    touch-action: manipulation;
    user-select: none;
  }
  .analysis-toggle:hover { background: var(--bg); border-color: #d1d5db; color: var(--text); }
  .analysis-toggle.active {
    background: #1a3a2a;
    color: #4ade80;
    border-color: transparent;
  }
  .analysis-toggle.active svg { stroke: #4ade80; }

  /* Clear filters */
  .clear-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    background: none;
    border: none;
    font-size: 11px;
    font-weight: 600;
    color: var(--red);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    padding: 4px 2px;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .clear-btn:hover { opacity: 0.7; }

  /* ── MAIN ────────────────────────────────────── */
  .main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 24px 72px;
  }

  /* ── DATE SECTION ────────────────────────────── */
  .date-section { margin-bottom: 52px; }

  .date-section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1.5px solid var(--border);
  }

  .date-heading {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 20px;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .date-count {
    font-size: 12px;
    color: var(--text-3);
    font-weight: 400;
    background: var(--border-soft);
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ── ARTICLE GRID ────────────────────────────── */
  .article-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  /* ── ARTICLE CARD ────────────────────────────── */
  .article-card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.35s ease both;
    cursor: default;
  }

  .article-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: transparent;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .article-card { animation: none; transition: none; }
    .article-card:hover { transform: none; }
  }

  /* Left accent bar */
  .card-accent {
    width: 3px;
    flex-shrink: 0;
    border-radius: 0;
    position: absolute;
    left: 0; top: 0; bottom: 0;
  }

  .card-inner {
    display: flex;
    flex-direction: row;
    flex: 1;
    position: relative;
  }

  .card-left-bar {
    width: 3px;
    flex-shrink: 0;
    border-radius: 12px 0 0 12px;
  }

  .card-body {
    padding: 16px 18px 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .card-cat-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 4px;
    color: white;
    text-transform: uppercase;
  }

  .dup-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 2px 7px;
    background: #FEF3C7;
    color: #92400E;
    border-radius: 4px;
    font-weight: 600;
  }

  .card-title {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 15.5px;
    font-weight: 400;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .card-summary {
    font-size: 13px;
    line-height: 1.68;
    color: var(--text-2);
    flex: 1;
    margin-bottom: 14px;
  }

  .card-summary strong {
    color: var(--text);
    font-weight: 600;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
    gap: 8px;
  }

  .card-source {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-3);
    font-weight: 500;
  }

  .source-favicon {
    width: 13px;
    height: 13px;
    border-radius: 2px;
    opacity: 0.75;
  }

  .card-link {
    font-size: 11px;
    color: var(--red);
    font-weight: 600;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: gap 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card-link:hover { gap: 6px; }
  .card-link:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }

  /* Analysis panel */
  .thy-panel {
    margin-top: 8px;
    padding: 10px 12px;
    background: #FFF8F8;
    border-left: 3px solid var(--red);
    border-radius: 0 6px 6px 0;
    font-size: 12px;
    line-height: 1.65;
    color: #7f1d1d;
    display: none;
  }
  .thy-panel.show { display: block; }

  .thy-toggle {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--red);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    padding: 0;
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    transition: opacity 0.15s;
  }
  .thy-toggle:hover { opacity: 0.75; }

  /* ── LOADING ─────────────────────────────────── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 55vh;
    flex-direction: column;
    gap: 14px;
    color: var(--text-3);
    font-size: 13px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 2.5px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  /* ── EMPTY STATE ─────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--text-3);
    display: none;
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.25; }
  .empty-state h3 { font-size: 16px; margin-bottom: 6px; color: var(--text-2); font-weight: 500; }
  .empty-state p { font-size: 13px; }

  /* ── FOOTER ──────────────────────────────────── */
  footer {
    background: var(--navy);
    color: rgba(255,255,255,0.3);
    text-align: center;
    padding: 20px 24px;
    font-size: 11px;
    letter-spacing: 0.02em;
  }

  /* ── RESPONSIVE ──────────────────────────────── */
  @media (max-width: 768px) {
    .header-stat { display: none; }
    .header-divider { display: none; }
    .site-name { font-size: 16px; }
    .article-grid { grid-template-columns: 1fr; gap: 12px; }
    .main { padding: 20px 16px 56px; }
    .filter-inner { padding: 8px 16px; }
    .filter-row-2 { padding: 8px 16px; }
    .date-tabs { padding: 0 16px; }
    .header-inner { padding: 0 16px; gap: 12px; }
    .airline-dropdown { width: 230px; }
  }

  @media (max-width: 480px) {
    .search-wrap { max-width: none; }
    .clear-btn span { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-name">Hava Kargo<span> Bülteni</span></div>
    <div class="header-divider"></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search" placeholder="Haberlerde ara…" autocomplete="off">
    </div>
    <div class="header-stat" id="header-stats"></div>
  </div>
</header>

<div class="date-bar" id="date-bar">
  <div class="date-tabs" id="date-tabs"></div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <span class="filter-label">Kategori</span>
    <div class="cat-pill active" data-cat="all">
      <span class="dot"></span>Tümü
    </div>
    <div class="cat-pill" data-cat="Filo & Network" data-color="var(--cat-filo)" style="--c:var(--cat-filo)">
      <span class="dot" style="background:var(--cat-filo)"></span>Filo &amp; Network
    </div>
    <div class="cat-pill" data-cat="Teknoloji & Dijitalleşme" data-color="var(--cat-tech)" style="--c:var(--cat-tech)">
      <span class="dot" style="background:var(--cat-tech)"></span>Teknoloji
    </div>
    <div class="cat-pill" data-cat="Ortaklık & İş Birlikleri" data-color="var(--cat-ortak)" style="--c:var(--cat-ortak)">
      <span class="dot" style="background:var(--cat-ortak)"></span>Ortaklık
    </div>
    <div class="cat-pill" data-cat="Özel Kargo" data-color="var(--cat-ozel)" style="--c:var(--cat-ozel)">
      <span class="dot" style="background:var(--cat-ozel)"></span>Özel Kargo
    </div>
    <div class="cat-pill" data-cat="Altyapı" data-color="var(--cat-alt)" style="--c:var(--cat-alt)">
      <span class="dot" style="background:var(--cat-alt)"></span>Altyapı
    </div>
    <div class="cat-pill" data-cat="Atama & Görevlendirme" data-color="var(--cat-atama)" style="--c:var(--cat-atama)">
      <span class="dot" style="background:var(--cat-atama)"></span>Atama
    </div>
    <div class="cat-pill" data-cat="Diğer" data-color="var(--cat-diger)" style="--c:var(--cat-diger)">
      <span class="dot" style="background:var(--cat-diger)"></span>Diğer
    </div>
  </div>

  <!-- Row 2: Airline + Analysis filters (shown after data loads) -->
  <div class="filter-row-2" id="filter-row-2">

    <!-- Havayolu dropdown -->
    <span class="filter-label">Filtrele</span>
    <div class="airline-dropdown-wrap">
      <button class="airline-btn" id="airline-btn"
              aria-haspopup="listbox" aria-expanded="false"
              aria-label="Havayolu filtresi">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21 4 19.5 2.5c-1.5-1.5-3.5-1.5-5 0L11 6 2.8 4.2l-1.4 1.4 4.9 4.9-.4.4-2.1-.7-.9.9 3 3-1.2 1.2 1.8 1.8 1.2-1.2 3 3 .9-.9-.7-2.1.4-.4 4.9 4.9 1.4-1.4Z"/>
        </svg>
        <span id="airline-btn-label">Havayolu</span>
        <svg id="airline-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="airline-dropdown" id="airline-dropdown" role="listbox" aria-multiselectable="true" aria-label="Havayolu seç">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Analiz toggle -->
    <button class="analysis-toggle" id="analysis-toggle" aria-pressed="false">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      Analizli Haberler
    </button>

    <!-- Clear all -->
    <button class="clear-btn" id="clear-filters" style="display:none" aria-label="Tüm filtreleri temizle">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
      <span>Temizle</span>
    </button>

  </div>
</div>

<main class="main" id="main">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Haberler yükleniyor…</div>
  </div>
  <div class="empty-state" id="empty-state">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <h3>Sonuç bulunamadı</h3>
    <p>Farklı arama veya filtre deneyin.</p>
  </div>
  <div id="cards-container"></div>
</main>

<footer>
  Bülten yapay zeka tarafından otomatik oluşturulmuştur. İçeriğin doğruluğu garanti edilmez.
</footer>

<script>
const CAT_COLORS = {
  'Filo & Network':           'var(--cat-filo)',
  'Teknoloji & Dijitalleşme': 'var(--cat-tech)',
  'Ortaklık & İş Birlikleri': 'var(--cat-ortak)',
  'Özel Kargo':               'var(--cat-ozel)',
  'Altyapı':                  'var(--cat-alt)',
  'Atama & Görevlendirme':    'var(--cat-atama)',
  'Diğer':                    'var(--cat-diger)'
};

const CAT_HEX = {
  'Filo & Network':           '#1D6FE8',
  'Teknoloji & Dijitalleşme': '#7C3AED',
  'Ortaklık & İş Birlikleri': '#059669',
  'Özel Kargo':               '#DB2777',
  'Altyapı':                  '#EA580C',
  'Atama & Görevlendirme':    '#0891B2',
  'Diğer':                    '#6B7280'
};

const SOURCE_LABELS = {
  'aircargonews':   'AirCargoNews',
  'aircargoweek':   'AirCargoWeek',
  'stattimes':      'StatTimes',
  'aircargoupdate': 'AirCargoUpdate',
  'payloadasia':    'PayloadAsia'
};

let allArticles  = [];
let activeCat    = 'all';
let activeDate   = 'all';
let searchQuery  = '';
let activeAirlines = new Set(); // empty = show all
let onlyAnalysis   = false;

// ── Airline keyword definitions ──────────────────────────────
const AIRLINE_DEFS = [
  { id: 'thy',       label: 'Turkish Airlines / THY', isTHY: true,
    kw: ['turkish cargo','turkish airlines','thy ','türk hava','türk kargo'] },
  { id: 'fedex',     label: 'FedEx',          kw: ['fedex'] },
  { id: 'ups',       label: 'UPS',            kw: [' ups ',' ups,', 'ups kargo'] },
  { id: 'dhl',       label: 'DHL',            kw: ['dhl'] },
  { id: 'emirates',  label: 'Emirates',       kw: ['emirates'] },
  { id: 'qatar',     label: 'Qatar Airways',  kw: ['qatar airways','qatar cargo'] },
  { id: 'lufthansa', label: 'Lufthansa',      kw: ['lufthansa'] },
  { id: 'cathay',    label: 'Cathay Pacific', kw: ['cathay'] },
  { id: 'atlas',     label: 'Atlas Air',      kw: ['atlas air'] },
  { id: 'airfrance', label: 'Air France',     kw: ['air france'] },
  { id: 'korean',    label: 'Korean Air',     kw: ['korean air'] },
  { id: 'singapore', label: 'Singapore Airlines', kw: ['singapore airlines'] },
  { id: 'cargolux',  label: 'Cargolux',       kw: ['cargolux'] },
  { id: 'amazon',    label: 'Amazon Air',     kw: ['amazon air'] },
  { id: 'geosky',    label: 'Geosky',         kw: ['geosky'] },
  { id: 'wizz',      label: 'Wizz Air',       kw: ['wizz air'] },
  { id: 'ecs',       label: 'ECS Group',      kw: ['ecs group'] },
  { id: 'menzies',   label: 'Menzies',        kw: ['menzies'] },
  { id: 'cargojet',  label: 'Cargojet',       kw: ['cargojet'] },
  { id: 'aeromexico',label: 'Aeromexico',     kw: ['aeromexico'] },
];

function detectAirlines(article) {
  const text = (' ' + stripHtml(article.title || '') + ' ' + stripHtml(article.summary || '') + ' ').toLowerCase();
  return AIRLINE_DEFS.filter(a => a.kw.some(kw => text.includes(kw))).map(a => a.id);
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}

function formatDateShort(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
}

function getFavicon(source) {
  const domains = {
    'aircargonews':   'aircargonews.net',
    'aircargoweek':   'aircargoweek.com',
    'stattimes':      'stattimes.com',
    'aircargoupdate': 'aircargoupdate.com',
    'payloadasia':    'payloadasia.com'
  };
  const domain = domains[source] || source;
  return `https://www.google.com/s2/favicons?sz=32&domain=${domain}`;
}

function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

function getFilteredArticles() {
  return allArticles.filter(a => {
    const catMatch      = activeCat === 'all' || a.category === activeCat;
    const dateMatch     = activeDate === 'all' || a.date === activeDate;
    const airlineMatch  = activeAirlines.size === 0 ||
                          (a._airlines && a._airlines.some(id => activeAirlines.has(id)));
    const analysisMatch = !onlyAnalysis ||
                          (a.thyImpact && a.thyImpact !== 'notr') ||
                          (a.thyAnalysis && a.thyAnalysis.trim() !== '');
    const q = searchQuery.toLowerCase();
    const searchMatch = !q ||
      stripHtml(a.title   || '').toLowerCase().includes(q) ||
      stripHtml(a.summary || '').toLowerCase().includes(q) ||
      (a.source || '').toLowerCase().includes(q);
    return catMatch && dateMatch && airlineMatch && analysisMatch && searchMatch;
  });
}

const elLoading = document.getElementById('loading');
const elEmpty   = document.getElementById('empty-state');
const elCards   = document.getElementById('cards-container');

function renderCards(articles) {
  elLoading.style.display = 'none';

  const byDate = {};
  articles.forEach(a => {
    const d = a.date || 'Tarihsiz';
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(a);
  });

  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));

  if (articles.length === 0) {
    elCards.innerHTML = '';
    elEmpty.style.display = 'block';
    return;
  }

  elEmpty.style.display = 'none';
  elCards.innerHTML = '';

  dates.forEach(date => {
    const section = document.createElement('div');
    section.className = 'date-section';

    const hdr = document.createElement('div');
    hdr.className = 'date-section-header';
    hdr.innerHTML = `
      <div class="date-heading">${formatDate(date)}</div>
      <div class="date-count">${byDate[date].length} haber</div>
    `;
    section.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'article-grid';

    byDate[date].forEach((article, i) => {
      const hex   = CAT_HEX[article.category] || '#6B7280';
      const hasThy = article.thyImpact && article.thyImpact !== 'notr' && article.thyAnalysis;
      const sourceLabel = SOURCE_LABELS[article.source] || article.source || '';

      const card = document.createElement('div');
      card.className = 'article-card';
      card.style.animationDelay = `${i * 35}ms`;

      card.innerHTML = `
        <div class="card-inner">
          <div class="card-left-bar" style="background:${hex}"></div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-cat-badge" style="background:${hex}">${article.category || 'Diğer'}</span>
              ${article.isDuplicate ? `<span class="dup-badge">↺ Tekrar haber</span>` : ''}
            </div>
            <div class="card-title">${article.title || ''}</div>
            <div class="card-summary">${article.summary || '<em style="color:var(--text-3)">Özet henüz oluşturulmadı.</em>'}</div>
            ${hasThy ? `
              <button class="thy-toggle" onclick="toggleThy(this)" aria-expanded="false">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                Analiz
              </button>
              <div class="thy-panel" role="region">${article.thyAnalysis}</div>
            ` : ''}
            <div class="card-footer">
              <div class="card-source">
                <img class="source-favicon" src="${getFavicon(article.source)}" alt="" loading="lazy" onerror="this.style.display='none'">
                ${sourceLabel}
              </div>
              ${article.link ? `<a class="card-link" href="${article.link}" target="_blank" rel="noopener noreferrer">
                Haberi oku
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </a>` : ''}
            </div>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });

    section.appendChild(grid);
    elCards.appendChild(section);
  });
}

function toggleThy(btn) {
  const panel = btn.nextElementSibling;
  const isOpen = panel.classList.toggle('show');
  btn.setAttribute('aria-expanded', isOpen);
  btn.innerHTML = `
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      style="transform:rotate(${isOpen ? 180 : 0}deg);transition:transform 0.2s"><polyline points="6 9 12 15 18 9"/></svg>
    ${isOpen ? 'Kapat' : 'Analiz'}
  `;
}

function updateStats(total, filtered) {
  const el = document.getElementById('header-stats');
  if (!el) return;
  el.innerHTML = filtered < total
    ? `<b>${filtered}</b> / ${total} haber`
    : `<b>${total}</b> haber`;
}

function buildDateTabs(articles) {
  const dates = [...new Set(articles.map(a => a.date).filter(Boolean))].sort((a, b) => b.localeCompare(a));
  if (dates.length <= 1) return;

  const bar  = document.getElementById('date-bar');
  const tabs = document.getElementById('date-tabs');
  bar.style.display = 'block';

  const allTab = document.createElement('div');
  allTab.className = 'date-tab active';
  allTab.textContent = 'Tüm Tarihler';
  allTab.dataset.date = 'all';
  tabs.appendChild(allTab);

  dates.forEach(d => {
    const tab = document.createElement('div');
    tab.className = 'date-tab';
    tab.textContent = formatDateShort(d);
    tab.dataset.date = d;
    tabs.appendChild(tab);
  });

  tabs.addEventListener('click', e => {
    const tab = e.target.closest('.date-tab');
    if (!tab) return;
    document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeDate = tab.dataset.date;
    render();
  });
}

function render() {
  const filtered = getFilteredArticles();
  renderCards(filtered);
  updateStats(allArticles.length, filtered.length);
}

// ── Airline filter builder ───────────────────────────────────
function buildAirlineFilter(articles) {
  // Tag each article with matching airlines
  articles.forEach(a => { a._airlines = detectAirlines(a); });

  // Find which airline IDs actually appear in the data
  const found = new Set();
  articles.forEach(a => a._airlines.forEach(id => found.add(id)));

  const relevant = AIRLINE_DEFS.filter(a => found.has(a.id));
  if (relevant.length === 0) return;

  // Sort: THY first, then alphabetical
  relevant.sort((a, b) => {
    if (a.isTHY) return -1;
    if (b.isTHY) return 1;
    return a.label.localeCompare(b.label, 'tr');
  });

  const dropdown = document.getElementById('airline-dropdown');
  dropdown.innerHTML = '';

  // Section label
  const lbl = document.createElement('div');
  lbl.className = 'dropdown-section-label';
  lbl.textContent = 'Havayolu Seç';
  dropdown.appendChild(lbl);

  relevant.forEach((airline, idx) => {
    // Divider after THY group
    if (idx > 0 && !airline.isTHY && relevant[idx - 1].isTHY) {
      const div = document.createElement('div');
      div.className = 'dropdown-divider';
      dropdown.appendChild(div);
    }

    const opt = document.createElement('div');
    opt.className = 'airline-option' + (airline.isTHY ? ' thy-opt' : '');
    opt.dataset.id = airline.id;
    opt.setAttribute('role', 'option');
    opt.setAttribute('aria-selected', 'false');
    opt.innerHTML = `
      <div class="airline-check">
        <svg width="9" height="7" viewBox="0 0 9 7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 3.5 3.5 6 8 1"/>
        </svg>
      </div>
      <span class="airline-label">${airline.label}</span>
      ${airline.isTHY ? '<span class="thy-badge">THY</span>' : ''}
    `;

    opt.addEventListener('click', e => {
      e.stopPropagation();
      if (activeAirlines.has(airline.id)) {
        activeAirlines.delete(airline.id);
        opt.classList.remove('selected');
        opt.setAttribute('aria-selected', 'false');
      } else {
        activeAirlines.add(airline.id);
        opt.classList.add('selected');
        opt.setAttribute('aria-selected', 'true');
      }
      syncAirlineBtn();
      render();
    });

    dropdown.appendChild(opt);
  });

  // Show the second filter row
  document.getElementById('filter-row-2').style.display = 'flex';
}

function syncAirlineBtn() {
  const btn   = document.getElementById('airline-btn');
  const lbl   = document.getElementById('airline-btn-label');
  const count = activeAirlines.size;
  // Remove old badge if any
  btn.querySelector('.airline-count')?.remove();

  if (count > 0) {
    btn.classList.add('has-filter');
    lbl.textContent = count === 1
      ? AIRLINE_DEFS.find(a => activeAirlines.has(a.id))?.label || 'Havayolu'
      : `${count} Havayolu`;
    const badge = document.createElement('span');
    badge.className = 'airline-count';
    badge.textContent = count;
    btn.insertBefore(badge, btn.querySelector('#airline-chevron'));
  } else {
    btn.classList.remove('has-filter');
    lbl.textContent = 'Havayolu';
  }
  syncClearBtn();
}

function syncClearBtn() {
  const hasAny = activeAirlines.size > 0 || onlyAnalysis;
  document.getElementById('clear-filters').style.display = hasAny ? 'inline-flex' : 'none';
}

// Airline dropdown open/close
document.getElementById('airline-btn').addEventListener('click', e => {
  e.stopPropagation();
  const dd      = document.getElementById('airline-dropdown');
  const chevron = document.getElementById('airline-chevron');
  const btn     = document.getElementById('airline-btn');
  const isOpen  = dd.classList.toggle('open');
  btn.setAttribute('aria-expanded', isOpen);
  chevron.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
});

// Close dropdown on outside click or Escape
document.addEventListener('click', () => {
  const dd = document.getElementById('airline-dropdown');
  if (!dd.classList.contains('open')) return;
  dd.classList.remove('open');
  document.getElementById('airline-btn').setAttribute('aria-expanded', 'false');
  document.getElementById('airline-chevron').style.transform = 'rotate(0deg)';
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const dd = document.getElementById('airline-dropdown');
    if (dd.classList.contains('open')) {
      dd.classList.remove('open');
      document.getElementById('airline-btn').focus();
    }
  }
});

// Analysis toggle
document.getElementById('analysis-toggle').addEventListener('click', () => {
  onlyAnalysis = !onlyAnalysis;
  const btn = document.getElementById('analysis-toggle');
  btn.classList.toggle('active', onlyAnalysis);
  btn.setAttribute('aria-pressed', onlyAnalysis);
  syncClearBtn();
  render();
});

// Clear all advanced filters
document.getElementById('clear-filters').addEventListener('click', () => {
  activeAirlines.clear();
  onlyAnalysis = false;

  document.querySelectorAll('.airline-option.selected').forEach(o => {
    o.classList.remove('selected');
    o.setAttribute('aria-selected', 'false');
  });

  const toggle = document.getElementById('analysis-toggle');
  toggle.classList.remove('active');
  toggle.setAttribute('aria-pressed', 'false');

  syncAirlineBtn();
  render();
});

// Category pills
document.querySelectorAll('.cat-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.cat-pill').forEach(p => {
      p.classList.remove('active');
      p.style.background = '';
      p.style.color = '';
    });
    pill.classList.add('active');
    if (pill.dataset.cat !== 'all') {
      const hex = CAT_HEX[pill.dataset.cat];
      if (hex) { pill.style.background = hex; pill.style.color = 'white'; pill.style.borderColor = 'transparent'; }
    }
    activeCat = pill.dataset.cat;
    render();
  });
});

// Search
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value;
    render();
  }, 220);
});

// Load data
const DATA_URL = 'https://n8n.emredemirbas.com/webhook/haber-ozetleri';

fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error('Veri kaynağına ulaşılamadı');
    return r.json();
  })
  .then(data => {
    allArticles = Array.isArray(data) ? data : (data.articles || []);
    buildDateTabs(allArticles);
    buildAirlineFilter(allArticles);
    render();
  })
  .catch(err => {
    elLoading.innerHTML = `
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#E63946" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <div style="color:#E63946;font-weight:600;font-size:14px">Veri yüklenemedi</div>
      <div style="font-size:12px;color:var(--text-3)">${err.message}</div>
    `;
  });
</script>
</body>
</html>
